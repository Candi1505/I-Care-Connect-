name: Temporary private library patch runner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch script from the staging branch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/apply-private-controlled-library.yml').read_text(encoding='utf-8')
          start="          python - <<'PY'\n"
          if start not in workflow:raise SystemExit('Embedded patch script was not found')
          block=workflow.split(start,1)[1].split('\n          PY',1)[0]
          block='\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(block,'private-library-patch','exec'),{})
          PY

      - name: Validate private library update
        shell: bash
        run: |
          set -euo pipefail
          node --check sil.js
          node --check service-worker.js
          grep -q 'Import 44 private PDFs' sil.html
          grep -q 'jszip@3.10.1' sil.html
          grep -q 'sil.js?v=20260801-2' sil.html
          grep -q 'florence-shell-20260801-4' service-worker.js
          grep -q 'Controlled library' sil.js
          grep -q 'data-open-private-document' sil.js
          grep -q 'sha256Hex' sil.js
          ! grep -q 'docs.google.com' sil.js
          python - <<'PY'
          from html.parser import HTMLParser
          from collections import Counter
          from pathlib import Path
          class Parser(HTMLParser):
              def __init__(self):super().__init__();self.ids=[]
              def handle_starttag(self,tag,attrs):
                  for key,value in attrs:
                      if key=='id' and value:self.ids.append(value)
          parser=Parser();parser.feed(Path('sil.html').read_text())
          duplicates={key:value for key,value in Counter(parser.ids).items() if value>1}
          if duplicates:raise SystemExit(f'Duplicate HTML ids: {duplicates}')
          PY
          git diff --check

      - name: Publish one clean branch commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-private-controlled-library.yml
          rm -f .github/workflows/bootstrap-private-library.yml
          rm -f .private-library-trigger
          rm -f .private-library-run
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --mixed cc66a7303bb32d729aa94e6f021dd96e822b5aa4
          git add -A
          git diff --cached --check
          git commit -m "Move controlled documents into private Florence storage"
          git push --force origin HEAD:agent/private-controlled-library
