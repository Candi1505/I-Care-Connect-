name: Apply Florence invoicing fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip invoicing workflow]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply prepared invoicing changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path)
              source = p.read_text(encoding='utf-8')
              updated = fn(source)
              if updated != source:
                  p.write_text(updated, encoding='utf-8')
                  print(f'Updated: {path}')
              else:
                  print(f'No change: {path}')

          edit('config.js', lambda s: s
               .replace('invoicing-workspace.js?v=20260804-1', 'invoicing-workspace.js?v=20260804-8')
               .replace('invoicing-workspace.js?v=20260804-7', 'invoicing-workspace.js?v=20260804-8'))

          edit('service-worker.js', lambda s: s
               .replace('florence-shell-20260804-8', 'florence-shell-20260804-9')
               .replace('invoicing-workspace.js?v=20260804-7', 'invoicing-workspace.js?v=20260804-8'))

          edit('index.html', lambda s: re.sub(
              r'<section id="finance-view" class="view">.*?<div id="invoice-list" class="stack"></div>\s*</section>',
              '<section id="finance-view" class="view">\n      <div class="page-head"><div><p class="eyebrow">Business billing</p><h2>NDIS invoicing</h2><p>Create, review, print and email NDIS invoices from Florence.</p></div></div>\n      <div id="invoice-list" class="stack"></div>\n    </section>',
              s,
              flags=re.S
          ))

          def invoice_fix(s):
              # Repair the malformed outstanding-total calculation currently on main.
              s = s.replace(
                  'outstanding=list.filter(x=>x.status!=="Paid").reduce((s,x)=>s+Number(x.total||0),0;q("#smart-invoice-summary")',
                  'outstanding=list.filter(x=>x.status!=="Paid").reduce((s,x)=>s+Number(x.total||0),0);q("#smart-invoice-summary")'
              )

              marker = '<div class="page-head"><div><p class="eyebrow">Business billing</p><h2>NDIS invoicing</h2><p>Create invoices from Florence shifts, apply saved service templates and prepare professional invoices for email.</p></div><div class="actions"><button id="smart-invoice-new" class="primary">+ Create invoice</button><button id="smart-template-new" class="secondary">Service templates</button></div></div>'
              notice = '<article class="notice"><strong>Pricing safety</strong><br>NDIS support-item prices are maximum guidance, not automatic charges. Use the participant\'s service agreement and confirm price changes before invoicing. SCHADS rates are used only for internal staffing-cost checks.</article>'
              if notice not in s:
                  s = s.replace(marker, marker + '\n' + notice)

              old_paid = 'if(btn){await b.db.from("invoices").update({status:"Paid",paid_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq("id",btn.dataset.paidInvoice);toast("Invoice marked paid");return loadInvoices()}'
              new_paid = 'if(btn){const {error:updateError}=await b.db.from("invoices").update({status:"Paid",paid_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq("id",btn.dataset.paidInvoice);if(updateError)return toast(updateError.message);toast("Invoice marked paid");return loadInvoices()}'
              s = s.replace(old_paid, new_paid)
              return s if s.endswith('\n') else s + '\n'

          edit('invoicing-workspace.js', invoice_fix)

          for path in ['tests/cloudflare_static_assets_audit.py', 'tests/florence_static_audit.py']:
              edit(path, lambda s: s
                   .replace('invoicing-workspace.js?v=20260804-2', 'invoicing-workspace.js?v=20260804-8')
                   .replace('invoicing-workspace.js?v=20260804-1', 'invoicing-workspace.js?v=20260804-8')
                   .replace('florence-shell-20260804-2', 'florence-shell-20260804-9'))
          PY

      - name: Validate Florence
        run: |
          node --check app.js
          node --check config.js
          node --check invoicing-workspace.js
          python tests/florence_static_audit.py
          python tests/cloudflare_static_assets_audit.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.js index.html invoicing-workspace.js service-worker.js tests/
          git diff --cached --quiet && exit 0
          git commit -m "Fix and secure Florence NDIS invoicing [skip invoicing workflow]"
          git push origin HEAD:main
