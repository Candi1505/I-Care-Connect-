name: Apply Florence MFA recovery fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/fix-mfa-factor-retry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-mfa-factor-retry
          fetch-depth: 0

      - name: Apply and validate MFA fix
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .mfa-fix.patch
          git apply .mfa-fix.patch
          node --check app.js
          node --check service-worker.js
          grep -q 'app.js?v=20260801-1' index.html
          grep -q 'florence-shell-20260801-1' service-worker.js
          grep -q 'friendlyName:`Florence-${suffix}`' app.js

      - name: Commit clean MFA fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .mfa-fix.patch .github/workflows/apply-florence-mfa-fix.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git diff --cached --check
          git commit -m "Fix interrupted Florence MFA enrolment"
          git push origin HEAD:agent/fix-mfa-factor-retry
