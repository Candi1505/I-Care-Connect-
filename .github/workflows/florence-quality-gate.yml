name: Florence production quality gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: JavaScript syntax checks
        run: |
          set -euo pipefail
          node --check config.js
          node --check app.js
          node --check operations.js
          node --check staff-management.js
          node --check set-password.js
          node --check sil.js
          node --check service-worker.js

      - name: Florence security and readiness audit
        run: python tests/florence_static_audit.py

      - name: Sydney invocation and governance-pack checks
        run: |
          set -euo pipefail
          grep -q 'functionRegion: "ap-southeast-2"' config.js
          grep -q 'region: safeOptions.region || window.FLORENCE_CONFIG.functionRegion' config.js
          grep -q 'Content-Security-Policy:' _headers
          grep -q 'Disallow: /' robots.txt
          grep -q "notify pgrst, 'reload schema'" florence-sil-schema-cache-repair.sql
          grep -q 'set search_path=public,extensions,pg_temp' florence-pgcrypto-pin-signing-hotfix.sql
          grep -q 'PIN_SIGNING_CRYPTO_READY' florence-pgcrypto-pin-signing-hotfix.sql
          grep -q 'S8_DUAL_SIGNOFF_TIMELINE_READY' florence-s8-dual-signoff-timeline-upgrade.sql
          test -f SECURITY.md
          test -f docs/security/FLORENCE_SECURITY_ASSURANCE_PACK.md
          test -f docs/security/FLORENCE_IMMEDIATE_ACTION_PLAN.md
          test -f docs/security/FLORENCE_LIVE_UAT_CHECKLIST.md
          test -f docs/security/FLORENCE_BACKUP_AND_RECOVERY_PROCEDURE.md
          test -f docs/security/FLORENCE_CYBER_AND_DATA_BREACH_RESPONSE_PLAN.md
          test -f docs/security/FLORENCE_MANAGEMENT_RISK_ACCEPTANCE.md
          test -f docs/security/FLORENCE_PRIVACY_AND_DIGITAL_RECORDS_ADDENDUM.md
          test -f docs/security/FLORENCE_USER_ACCESS_AND_CONFIDENTIALITY_ACKNOWLEDGEMENT.md

      - name: Cloudflare Workers static-assets and multi-page routing audit
        run: python tests/cloudflare_static_assets_audit.py

      - name: Wrangler deployment dry run
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/florence-worker

      - name: Repository whitespace and patch validation
        run: git diff --check

  database-migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: florence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d florence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: florence_test
    steps:
      - uses: actions/checkout@v5

      - name: Confirm PostgreSQL client
        run: psql --version

      - name: Build Florence schema through every production migration
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/supabase_postgres_stub.sql
          psql -v ON_ERROR_STOP=1 -f tests/supabase_pgcrypto_schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase-schema.sql
          psql -v ON_ERROR_STOP=1 -f florence-audit-readiness-upgrade.sql
          psql -v ON_ERROR_STOP=1 -f florence-operational-controls-upgrade.sql
          psql -v ON_ERROR_STOP=1 -f florence-production-hardening-upgrade.sql
          psql -v ON_ERROR_STOP=1 -f florence-pgcrypto-pin-signing-hotfix.sql | tee /tmp/florence-pin-hotfix.txt
          grep -q 'PIN_SIGNING_CRYPTO_READY' /tmp/florence-pin-hotfix.txt
          psql -v ON_ERROR_STOP=1 -f florence-controlled-library-access-upgrade.sql
          psql -v ON_ERROR_STOP=1 -f florence-controlled-library-upload-hotfix.sql
          psql -v ON_ERROR_STOP=1 -f tests/florence_pre_final_seed.sql
          psql -v ON_ERROR_STOP=1 -f florence-final-readiness-upgrade.sql | tee /tmp/florence-final-migration.txt
          grep -q 'PASS_FOR_LIVE_UAT' /tmp/florence-final-migration.txt
          psql -v ON_ERROR_STOP=1 -f florence-remove-mary-jane-sifrol-hotfix.sql | tee /tmp/florence-demo-cleanup.txt
          grep -q 'REMOVED' /tmp/florence-demo-cleanup.txt
          psql -v ON_ERROR_STOP=1 -f florence-s8-dual-signoff-timeline-upgrade.sql | tee /tmp/florence-s8-timeline.txt
          grep -q 'S8_DUAL_SIGNOFF_TIMELINE_READY' /tmp/florence-s8-timeline.txt
          psql -v ON_ERROR_STOP=1 -f florence-portal-complaints-upgrade.sql | tee /tmp/florence-portal-complaints.txt
          grep -q 'PORTAL_COMPLAINTS_READY' /tmp/florence-portal-complaints.txt

      - name: Reproduce and repair the live missing SIL table condition
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c 'drop table public.sil_records cascade; drop table public.sil_provider_profiles cascade;'
          psql -v ON_ERROR_STOP=1 -f florence-sil-schema-cache-repair.sql | tee /tmp/florence-sil-repair.txt
          grep -q 'SIL_SCHEMA_READY_CACHE_RELOAD_SENT' /tmp/florence-sil-repair.txt
          psql -v ON_ERROR_STOP=1 -f florence-sil-schema-cache-repair.sql | tee /tmp/florence-sil-repair-repeat.txt
          grep -q 'SIL_SCHEMA_READY_CACHE_RELOAD_SENT' /tmp/florence-sil-repair-repeat.txt

      - name: Exercise cleanup, server time clock and role RLS boundaries
        run: psql -v ON_ERROR_STOP=1 -f tests/florence_database_smoke_test.sql

      - name: Exercise Supabase pgcrypto PIN signing
        run: psql -v ON_ERROR_STOP=1 -f tests/florence_pin_crypto_smoke_test.sql

      - name: Exercise S8 dual PIN signing and participant timeline
        run: psql -v ON_ERROR_STOP=1 -f tests/florence_s8_timeline_smoke_test.sql

      - name: Exercise family and participant portal complaints
        run: psql -v ON_ERROR_STOP=1 -f tests/florence_portal_complaints_smoke_test.sql
