name: Temporary Florence final-readiness patcher

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/florence-final-readiness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply reviewed final-readiness patch
        run: |
          set -euo pipefail
          if grep -q 'PASS_FOR_LIVE_UAT' florence-final-readiness-upgrade.sql \
             && grep -q 'db.from("sil_records")' sil.js \
             && grep -q 'clock_in_timesheet' operations.js; then
            echo 'Final-readiness patch is already applied.'
          else
            python -c "from pathlib import Path; p=Path('tools/apply_final_readiness_patch.py'); s=p.read_text(encoding='utf-8'); old='updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)'; new='updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)'; assert old in s, 'Could not locate regex_once implementation'; p.write_text(s.replace(old,new,1),encoding='utf-8')"
            python tools/apply_final_readiness_patch.py
          fi

      - name: Validate patched Florence release
        run: |
          set -euo pipefail
          node --check app.js
          node --check operations.js
          node --check staff-management.js
          node --check sil.js
          node --check service-worker.js
          python tests/florence_static_audit.py
          git diff --check

      - name: Commit reviewed application changes to the readiness branch
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No additional patch commit required.'
            exit 0
          fi
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js operations.js sil.js index.html sil.html service-worker.js florence-final-readiness-upgrade.sql tools/apply_final_readiness_patch.py
          git diff --cached --check
          git commit -m "Complete Florence final production-readiness controls"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
