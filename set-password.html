<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5f8f72">
  <meta name="referrer" content="no-referrer">
  <title>Set password · Florence</title>
  <link rel="icon" href="florence-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="florence-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260801-1">
</head>
<body>
<section class="login-screen">
  <main class="login-card" aria-labelledby="password-setup-title">
    <div class="brand-mark">🌿</div>
    <h1 id="password-setup-title">Set your Florence password</h1>
    <p id="password-setup-intro">Checking your secure access link…</p>

    <form id="password-setup-form" class="hidden">
      <label>New password
        <input id="new-password" type="password" minlength="10" autocomplete="new-password" required>
      </label>
      <label>Confirm new password
        <input id="confirm-password" type="password" minlength="10" autocomplete="new-password" required>
      </label>
      <button id="save-password" class="primary wide" type="submit">Save password securely</button>
    </form>

    <div id="password-setup-status" class="notice" role="status" aria-live="polite">
      Please wait while Florence verifies the link.
    </div>

    <a id="continue-to-florence" class="primary wide hidden" href="./">Continue to Florence sign in</a>
    <a class="link wide" href="./">Return to sign in</a>
  </main>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.106.2"></script>
<script src="config.js"></script>
<script src="set-password.js?v=20260802-1"></script>
</body>
</html>
