<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5f8f72">
  <meta name="referrer" content="no-referrer">
  <title>Set up account · Florence</title>
  <link rel="icon" href="florence-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="florence-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260801-1">
</head>
<body>
<section class="login-screen">
  <main class="login-card" aria-labelledby="password-setup-title">
    <div class="brand-mark">🌿</div>
    <h1 id="password-setup-title">Set up your Florence account</h1>
    <p id="password-setup-intro">Enter the email address and one-time setup code supplied privately by your Florence supervisor.</p>

    <form id="password-setup-form">
      <label>Email address
        <input id="setup-email" type="email" autocomplete="email" required>
      </label>
      <label>Eight-digit setup code
        <input id="setup-code" type="text" inputmode="numeric" autocomplete="one-time-code" minlength="8" maxlength="8" pattern="[0-9]{8}" required>
      </label>
      <label>New password
        <input id="new-password" type="password" minlength="10" autocomplete="new-password" required>
      </label>
      <label>Confirm new password
        <input id="confirm-password" type="password" minlength="10" autocomplete="new-password" required>
      </label>
      <button id="save-password" class="primary wide" type="submit">Create password securely</button>
    </form>

    <div id="password-setup-status" class="notice" role="status" aria-live="polite">
      Setup codes expire after 30 minutes and can only be used once.
    </div>

    <a id="continue-to-florence" class="primary wide hidden" href="./">Continue to Florence sign in</a>
    <a class="link wide" href="./">Return to sign in</a>
  </main>
</section>

<script src="config.js"></script>
<script src="set-password.js?v=20260802-2"></script>
</body>
</html>
